<!doctype html><html lang="nl"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300..500&family=Courier+Prime&family=Hanken+Grotesk:wght@300;400&display=swap"><style>*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#222321;--soft:#55574F;--sheet:#F1F1EE;--G:linear-gradient(180deg,#9A9FE2,#B9C0EC 40%,#8FD0BA 75%,#52B48F);--GH:linear-gradient(90deg,#9A9FE2,#B9C0EC 40%,#8FD0BA 70%,#52B48F);--yel:#F4E86E}
body{background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased;font-family:"Hanken Grotesk",sans-serif;font-weight:300}
.scene{width:1440px;background:var(--sheet)}
.bar{display:flex;justify-content:space-between;align-items:center;height:72px;padding:0 185px;font-family:"Courier Prime",monospace;font-size:13px}
.bar nav{display:flex;gap:28px;align-items:center}.bar .y{background:linear-gradient(97deg,#F7F0A0,#F4E86E 50%,#F1E15A);padding:12px 16px}
.mob{width:390px;background:var(--sheet);display:flex;justify-content:space-between;align-items:center;height:64px;padding:0 22px 0 16px;font-family:"Courier Prime",monospace;font-size:13px}
.mob .y{background:linear-gradient(97deg,#F7F0A0,#F4E86E 50%,#F1E15A);padding:10px 14px}.mob > span:last-child{display:flex;gap:16px;align-items:center}.mob .m{font-family:"Hanken Grotesk";font-size:15px}
.big{width:1440px;height:420px;background:var(--sheet);display:flex;align-items:center;justify-content:center}
.big .logo{font-size:96px}
.logo{display:inline-flex;align-items:baseline;white-space:nowrap;line-height:1;font-size:22px}
/* 1 · serif + rechtopstaande cursor in verloop */
.l1{font-family:Newsreader,serif;font-weight:300;letter-spacing:-.01em}
.l1 i{display:inline-block;width:.11em;height:.9em;background:var(--G);margin-left:.12em;transform:translateY(.08em)}
/* 2 · kleine letters, blokcursor in verloop (horizontaal) */
.l2{font-family:"Hanken Grotesk",sans-serif;font-weight:300;letter-spacing:-.03em;text-transform:lowercase}
.l2 i{display:inline-block;width:.5em;height:.78em;background:var(--GH);margin-left:.08em;transform:translateY(.06em)}
/* 3 · cursor als onderstreep: Pam & Sam_ */
.l3{font-family:"Courier Prime",monospace;font-weight:400;letter-spacing:-.02em}
.l3 i{display:inline-block;width:.6em;height:.12em;background:var(--GH);margin-left:.06em}
/* 4 · de markering: één streep van lavendel naar mint onder het hele woord */
.l4{font-family:Newsreader,serif;font-weight:300;background:linear-gradient(90deg,#C6C8EA,#D5D9F2 40%,#CFE3DE 65%,#BFE1D3) 0 88%/100% 42% no-repeat;padding:0 .08em}
/* 5 · het &-teken als vorm: groot, in verloop, de namen eromheen */
.l5{font-family:Newsreader,serif;font-weight:300;align-items:center;gap:0}
.l5 .a{font-size:1.9em;line-height:.8;background:var(--G);-webkit-background-clip:text;background-clip:text;color:transparent;margin:0 .06em 0 .04em;font-weight:400;transform:translateY(.08em)}
.l5 .s{font-family:"Hanken Grotesk",sans-serif;font-weight:300;letter-spacing:-.02em}
</style></head><body>
<div class="scene"><div class="bar"><span class="logo l5">Pam<span class="a">&amp;</span><span class="s">Sam</span></span><nav><span>Aanpak</span><span>Tarieven</span><span>Contact</span><span class="y">Probeer gratis</span></nav></div></div>
<div style="height:24px"></div><div class="mob"><span class="logo l5">Pam<span class="a">&amp;</span><span class="s">Sam</span></span><span><span class="m">Menu</span><span class="y">Probeer gratis</span></span></div>
<div style="height:24px"></div><div class="big"><span class="logo l5">Pam<span class="a">&amp;</span><span class="s">Sam</span></span></div></body></html>
