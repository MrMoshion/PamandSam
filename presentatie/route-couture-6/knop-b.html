<!doctype html><html lang="nl"><head><meta charset="utf-8"><title>Knop B · Licht gevuld</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,300..500&family=Jost:wght@300;400&display=swap">
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Jost,sans-serif;font-weight:300;-webkit-font-smoothing:antialiased;background:#FBFAF8;padding:28px 32px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.c{border-radius:4px;overflow:hidden;height:300px;display:flex;flex-direction:column;justify-content:flex-end;padding:24px 26px}
.c .lab{font-size:11px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:auto}
.c h2{font-family:"Literata",serif;font-weight:400;font-size:34px;letter-spacing:-.02em;margin-bottom:22px;text-align:center}
.c .msg{font-family:"Literata",serif;font-weight:300;font-size:17px;line-height:1.55;margin-bottom:6px}.c.sam .msg{font-family:Jost;font-weight:300}
.c .f{border-bottom:1px solid currentColor;padding:12px 0 8px;font-size:15px;opacity:.75}
.acts{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:14px}
.btn{display:inline-block;padding:12px 22px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;border-radius:2px;font-weight:400}
.cen{text-align:center}
</style></head><body><div class="row"><div class="c neutraal" style="background:linear-gradient(#F9F6F0 0 30%,#F0EADD 30%);color:#2F2A22"><p class="lab" style="color:#5E564A">Huisstijl</p><h2 style="color:#2F2A22">Bespreek het met Pam of Sam.</h2><p class="cen"><a class="btn" style="background:#DBD6CA;color:#2F2A22;border:1px solid #DBD6CA">Probeer gratis</a></p></div><div class="c pam" style="background:linear-gradient(#F9F4EE 0 30%,#EEE3D5 30%);color:#33281D"><p class="lab" style="color:#63523F">Pam</p><p class="msg" style="color:#63523F">Wat mis je het meest, als je eerlijk bent?</p><div class="f" style="color:#63523F">Schrijf hier…</div><div class="acts" style="color:#63523F"><span style="text-decoration:underline;text-underline-offset:4px">Wissel naar Sam</span><a class="btn" style="background:#D9CFC2;color:#33281D;border:1px solid #D9CFC2">Verstuur</a></div></div><div class="c sam" style="background:linear-gradient(#FAF9F7 0 30%,#EEEDEA 30%);color:#262C30"><p class="lab" style="color:#51575C">Sam</p><p class="msg" style="color:#51575C">Wat wil jij, los van wat anderen vinden?</p><div class="f" style="color:#51575C">Schrijf hier…</div><div class="acts" style="color:#51575C"><span style="text-decoration:underline;text-underline-offset:4px">Wissel naar Pam</span><a class="btn" style="background:#D9D8D6;color:#262C30;border:1px solid #D9D8D6">Verstuur</a></div></div></div></body></html>
